<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingreso — Gestión de Aseo de Obra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <p class="auth-kicker">Panel de acceso</p>
    <h1>Gestión de Aseo de Obra</h1>
    <p class="auth-subtitle">Ingresa con tu cuenta para continuar.</p>

    <form id="login-form" novalidate>
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" required autocomplete="username" />

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" />

      <button type="submit">Ingresar</button>
      <p id="login-error" role="alert"></p>
    </form>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
