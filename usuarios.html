<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usuarios — Gestión de Aseo de Obra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>

  <main>
    <div class="panel-header">
      <h2>Usuarios</h2>
      <div>
        <button class="secondary" id="refresh-users-btn">Actualizar</button>
        <button id="open-create-user-btn">+ Crear usuario</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Correo</th>
            <th>Nombre</th>
            <th>Rol</th>
            <th>Estado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="users-body">
          <tr><td colspan="5" class="empty-state">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <dialog id="create-user-modal">
    <h3>Crear usuario</h3>
    <form id="create-user-form" novalidate>
      <label for="new-email">Correo</label>
      <input id="new-email" type="email" required />

      <label for="new-nombre">Nombre</label>
      <input id="new-nombre" type="text" required />

      <label for="new-password">Contraseña temporal</label>
      <input id="new-password" type="password" required minlength="6" />

      <label for="new-role">Rol</label>
      <select id="new-role">
        <option value="empleado">Empleado</option>
        <option value="admin">Admin</option>
        <option value="superadmin">Superadmin</option>
      </select>

      <div class="modal-actions">
        <button type="submit">Crear usuario</button>
        <button type="button" class="secondary" id="create-user-cancel">Cancelar</button>
      </div>
    </form>
  </dialog>

  <dialog id="edit-user-modal">
    <h3>Editar usuario</h3>
    <form id="edit-user-form" novalidate>
      <label for="edit-user-nombre">Nombre</label>
      <input id="edit-user-nombre" type="text" required />

      <label for="edit-user-role">Rol</label>
      <select id="edit-user-role">
        <option value="empleado">Empleado</option>
        <option value="admin">Admin</option>
        <option value="superadmin">Superadmin</option>
      </select>

      <label class="checkbox-label">
        <input id="edit-user-activo" type="checkbox" />
        Usuario activo
      </label>

      <div class="modal-actions">
        <button type="submit">Guardar cambios</button>
        <button type="button" class="secondary" id="edit-user-cancel">Cancelar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/usuarios.js"></script>
</body>
</html>
