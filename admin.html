<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Órdenes — Gestión de Aseo de Obra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>

  <main>
    <div class="panel-header">
      <h2>Todas las órdenes</h2>
      <div>
        <button class="secondary" id="refresh-btn">Actualizar</button>
        <a class="button-link" href="nueva-orden.html">+ Nueva orden</a>
      </div>
    </div>

    <form class="inline-form" id="filters-form">
      <div>
        <label for="filter-search">Buscar</label>
        <input type="search" id="filter-search" placeholder="Piso, contratista, comentarios..." />
      </div>
      <div>
        <label for="filter-empleado">Empleado</label>
        <select id="filter-empleado"><option value="">Todos</option></select>
      </div>
      <div>
        <label for="filter-obra">Obra</label>
        <select id="filter-obra"><option value="">Todas</option></select>
      </div>
      <div>
        <label for="filter-desde">Desde</label>
        <input type="date" id="filter-desde" />
      </div>
      <div>
        <label for="filter-hasta">Hasta</label>
        <input type="date" id="filter-hasta" />
      </div>
      <button type="submit" id="filter-search-btn">Buscar</button>
      <button type="button" class="secondary" id="filter-clear">Limpiar filtros</button>
    </form>

    <div class="table-toolbar">
      <p class="table-counter" id="orders-counter" aria-live="polite"></p>
      <button type="button" class="secondary" id="export-btn">Exportar CSV</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Fecha/hora</th>
            <th>Obra</th>
            <th>Piso/Lugar</th>
            <th>Contratista</th>
            <th>Creado por</th>
            <th>Fotos (antes/después)</th>
            <th>Estado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="orders-body">
          <tr><td colspan="8" class="empty-state">Cargando...</td></tr>
        </tbody>
      </table>
    </div>

    <nav class="pager" id="pager" aria-label="Paginación de órdenes" hidden></nav>
  </main>

  <dialog id="detail-modal">
    <div id="modal-body"></div>
    <button class="secondary" id="modal-close">Cerrar</button>
  </dialog>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
