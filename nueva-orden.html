<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva orden — Gestión de Aseo de Obra</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>

  <main>
    <h2>Nueva orden de limpieza</h2>

    <form id="order-form" novalidate>
      <div class="form-card">
        <label for="obra">Obra</label>
        <select id="obra" name="obra" required>
          <option value="">Selecciona una obra</option>
        </select>

        <label for="piso">Piso / Lugar</label>
        <input id="piso" name="piso" type="text" placeholder="Ej. Piso 4 - Ala norte" required />

        <label for="contratista">Contratista responsable de los residuos</label>
        <input id="contratista" name="contratista" type="text" placeholder="Nombre del contratista" required />

        <label for="fecha-hora">Fecha y hora</label>
        <input id="fecha-hora" name="fecha-hora" type="datetime-local" required />

        <label for="comentarios">Comentarios (opcional)</label>
        <textarea id="comentarios" name="comentarios" placeholder="Detalles adicionales"></textarea>
      </div>

      <div class="evidence-grid">
        <fieldset class="evidence-fieldset">
          <legend>Evidencia — antes de limpiar</legend>
          <div class="dropzone" id="dropzone-antes" tabindex="0" role="button" aria-label="Adjuntar fotos de antes">
            <p>Arrastra fotos aquí o haz clic para elegirlas</p>
            <p class="dropzone-hint">Puedes adjuntar varias</p>
          </div>
          <input type="file" id="fotos-antes" accept="image/*" capture="environment" multiple hidden />
          <div class="thumb-grid" id="preview-antes"></div>
        </fieldset>

        <fieldset class="evidence-fieldset">
          <legend>Evidencia — después de limpiar (opcional)</legend>
          <div class="dropzone" id="dropzone-despues" tabindex="0" role="button" aria-label="Adjuntar fotos de después">
            <p>Arrastra fotos aquí o haz clic para elegirlas</p>
            <p class="dropzone-hint">Si aún no terminas, déjalo vacío y completa la orden después desde "Mis órdenes"</p>
          </div>
          <input type="file" id="fotos-despues" accept="image/*" capture="environment" multiple hidden />
          <div class="thumb-grid" id="preview-despues"></div>
        </fieldset>
      </div>

      <button type="submit" id="submit-btn">Registrar orden</button>
      <p id="status" role="status"></p>
    </form>
  </main>

  <script type="module" src="js/nueva-orden.js"></script>
</body>
</html>
